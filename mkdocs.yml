site_name: Kurs Programowania Mikrokontrolerów
site_description: Kurs ESP32-C6 z Arduino IDE – od podstaw do systemów bezprzewodowych
site_author: AGH-AIOTA

docs_dir: course

theme:
  name: material
  language: pl
  font:
    text: Outfit
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.footer
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Przełącz na tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Przełącz na tryb jasny

plugins:
  - search
  - callouts

nav:
  - Start:
      - Mapa kursu: start/index.md
      - Teoria – czym jest mikrokontroler: start/teoria.md
      - Lista potrzebnego sprzętu: start/sprzet.md
      - Instalacja Arduino IDE: start/ide.md

  - Podstawy:
      - Przegląd modułu: podstawy/index.md
      - "Ćw. 1 – Serial: Hello World": podstawy/serial.md
      - "Lekcja: Płytka stykowa (Breadboard)": podstawy/breadboard.md
      - "Ćw. 2 – Wyjście cyfrowe: LED": podstawy/cyfrowe.md
      - "Ćw. 3 – PWM: płynna jasność": podstawy/pwm.md
      - "Ćw. 4 – ADC: potencjometr": podstawy/adc.md
      - "Ćw. 5 – Wejście cyfrowe: przycisk": podstawy/wejscie.md
      - "Ćw. 6 – Przerwania zewnętrzne": podstawy/interrupty.md

  - Protokoły:
      - Przegląd modułu: protokoly/index.md
      - "Ćw. 7 – I2C: czujnik MPU6050": protokoly/i2c.md
      - "Ćw. 8 – UART: loopback i komendy": protokoly/uart.md
      - "Ćw. 9 – SPI: wyświetlacz OLED": protokoly/spi.md

  - Systemy:
      - Przegląd modułu: systemy/index.md
      - "Ćw. 10–11 – FreeRTOS: zadania i kolejki": systemy/freertos.md
      - "Ćw. 12 – Deep Sleep": systemy/deepsleep.md

  - Bezprzewodowe:
      - Przegląd modułu: bezprzewodowe/index.md
      - "👥 Ćw. 13 – ESP-NOW": bezprzewodowe/espnow.md
      - "Ćw. 14 – Wi-Fi i Web Server": bezprzewodowe/wifi.md
      - "Ćw. 15 – Bluetooth Low Energy": bezprzewodowe/ble.md

  - Materiały:
      - Kod wzorcowy: materialy/kod_wzorcowy.md
      - Pinout ESP32-C6 DevKit: materialy/pinout.md
      - Zasoby i dokumentacja: materialy/zasoby.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/custom.css
