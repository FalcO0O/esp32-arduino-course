site_name: Kurs Programowania Mikrokontrolerów
site_description: Kurs ESP32-C6 z Arduino IDE – od podstaw do systemów bezprzewodowych
site_author: AGH-AIOTA

docs_dir: course

theme:
  name: material
  language: pl
  font:
    text: Outfit
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.footer
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Przełącz na tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Przełącz na tryb jasny

plugins:
  - search
  - callouts

nav:
  - Start:
      - Mapa kursu: index.md
      - 1. Teoria – czym jest mikrokontroler: start/teoria.md
      - 2. Płytka ESP32-C6: start/sprzet.md
      - 3. Konfiguracja środowiska i Wokwi: start/ide.md

  - Podstawy:
      - Przegląd modułu: podstawy/index.md
      - "Wstęp do IO: Cyfrowe wyjścia i wejścia": podstawy/cyfrowe.md
      - "Sygnały: PWM i ADC": podstawy/analogowe.md

  - Sterowanie:
      - Przegląd modułu: sterowanie/index.md
      - "Czas i Przerwania (millis(), ISR)": sterowanie/czas_przerwania.md

  - Protokoły:
      - Przegląd modułu: protokoly/index.md
      - "UART: loopback i komendy": protokoly/uart.md
      - "Magistrala I2C (Akcelerometr)": protokoly/i2c.md
      - "Magistrala SPI (Wyświetlacz TFT)": protokoly/spi.md
      - "Transmisja jednoprzewodowa (WS2812B)": protokoly/onewire.md

  - Systemy:
      - Przegląd modułu: systemy/index.md
      - "Ćw. 11-12 – FreeRTOS: Zadania i kolejki": systemy/freertos.md
      - "Ćw. 13 – Deep Sleep: zarządzanie energią": systemy/deepsleep.md

  - Bezprzewodowe:
      - Przegląd modułu: bezprzewodowe/index.md
      - "👥 Ćw. 14 – ESP-NOW": bezprzewodowe/espnow.md
      - "Ćw. 15-16 – Sieci i radio: Wi-Fi i BLE": bezprzewodowe/wifi_ble.md

  - Materiały:
      - Kod wzorcowy: materialy/kod_wzorcowy.md
      - Pinout ESP32-C6 DevKit: materialy/pinout.md
      - Zasoby i dokumentacja: materialy/zasoby.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/custom.css
